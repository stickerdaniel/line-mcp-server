name: Post No Bills

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  post-no-bills:
    runs-on: ubuntu-latest
    steps:
      - name: Check agent attribution and hidden Unicode
        uses: stickerdaniel/post-no-bills@308298394473ed80000cc5082ae93a1c5bc8563e # v4.1.0
        with:
          model-attribution: host
          # Traditional Chinese fixtures are intentional non-Latin text.
          unicode-exclude-paths: |
            test/fixtures/
