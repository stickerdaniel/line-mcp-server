name: PR Title

# GitHub suppresses pull_request_target for SHA-like source branch names.
# Renaming a head branch closes its pull request. Open a replacement pull
# request from a non-SHA-like source branch so this check can run.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # Type stripping needs Node 24.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The title comes from the API rather than the event, so a rerun checks
      # the current title. This is the only step that holds a token.
      - name: Fetch current pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            > "$RUNNER_TEMP/pull-request.json"

      - name: Validate current pull request title
        run: node scripts/check-pr-title.ts --pr-json "$RUNNER_TEMP/pull-request.json"
