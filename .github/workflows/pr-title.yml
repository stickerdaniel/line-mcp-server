name: PR Title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR Title
    runs-on: ubicloud-standard-2
    steps:
      # The title is passed as data through the environment, never interpolated
      # into the script, because it is pull request content.
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [A-Z](.*[^.])?$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Title must be '<type>(<scope>): <Subject>' with a capitalized subject and no trailing period."
            exit 1
          fi
          subject="${TITLE#*: }"
          if [ "${#subject}" -gt 50 ]; then
            echo "::error::Subject is ${#subject} characters; the limit is 50."
            exit 1
          fi
