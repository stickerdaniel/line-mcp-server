name: Actionlint

# No path filter: this check is required, and a required check that never
# starts blocks every pull request that does not touch a workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          # Log-only reporter: needs no write permissions and works on both
          # pull_request and push events. fail_level makes findings fail the job
          # instead of only annotating.
          reporter: github-annotations
          filter_mode: nofilter
          fail_level: error
