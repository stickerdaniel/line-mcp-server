name: CI

on:
  push:
    branches: [main]
  # Every pull request, including stacked ones based on another branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-os:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubicloud-standard-2
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node:sqlite and type stripping need Node 24.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

  # The npm package as users install it, on macOS like the LaunchAgent it installs.
  package-os:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack, install and test the package
        run: node scripts/smoke-pack.ts

  # Branch protection requires `verify` and `package`. These pass only when
  # every leg of their matrix passed; a failed, cancelled or skipped leg fails them.
  verify:
    needs: verify-os
    if: always()
    runs-on: ubicloud-standard-2
    timeout-minutes: 2
    steps:
      - name: Check the matrix result
        env:
          RESULT: ${{ needs.verify-os.result }}
        run: test "$RESULT" = success

  package:
    needs: package-os
    if: always()
    runs-on: ubicloud-standard-2
    timeout-minutes: 2
    steps:
      - name: Check the matrix result
        env:
          RESULT: ${{ needs.package-os.result }}
        run: test "$RESULT" = success
